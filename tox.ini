[tox]
skipsdist=true

[testenv]
commands =
    {envpython} -V
    {envpython} -m compileall speedtest.py
    {envpython} speedtest.py
    {envpython} speedtest.py --source 172.17.0.1
    {envpython} tests/scripts/source.py

[testenv:flake8]
basepython=python
deps=flake8
commands =
    {envpython} -V
    flake8 speedtest.py

[testenv:pypy3]
commands =
    pypy3 -V
    pypy3 -m compileall speedtest.py
    pypy3 speedtest.py
    pypy3 speedtest.py --source 172.17.0.1
    pypy3 tests/scripts/source.py
